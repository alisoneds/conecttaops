version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: conecttaops-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: conecttaops_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conecttaops-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/conecttaops_dw
      - GLOBUS_HOST=192.168.50.208
      - GLOBUS_PORT=1521
      - GLOBUS_SERVICE_NAME=ORACLE
      - GLOBUS_USER=usr_dashboard
      - GLOBUS_PASSWORD=Jtu#2026ubt
      - EMPRESA_CODIGO=2
      - GARAGEM_CODIGO=2
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conecttaops-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

volumes:
  postgres_data:
