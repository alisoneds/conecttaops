name: ConecttaOps - Integracao Continua (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-qa:
    name: QA & Testes Automatizados (Backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: conectta_user
          POSTGRES_PASSWORD: conectta_password
          POSTGRES_DB: conecttaops_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Analise Estatica & Linting (Flake8)
        run: |
          flake8 backend/ --max-line-length=120 --exclude=backend/alembic

      - name: Executar Suite de QA & Cobertura (Pytest)
        env:
          POSTGRES_USER: conectta_user
          POSTGRES_PASSWORD: conectta_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: conecttaops_dw
          PYTHONPATH: backend
        run: |
          pytest backend/tests -v --cov=backend/app --cov-fail-under=80

  frontend-build:
    name: Build & Linting (Frontend Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependencias
        run: |
          cd frontend
          npm ci

      - name: Validar Linting do Frontend
        run: |
          cd frontend
          npm run lint --if-present

      - name: Compilar Frontend (Build Check)
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: |
          cd frontend
          npm run build
